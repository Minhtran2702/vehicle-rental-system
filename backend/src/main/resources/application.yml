spring:
  config:
    import: optional:file:./application-local.yml   # cấu hình riêng của từng máy (Git bỏ qua file này)
  application:
    name: vehicle-rental-backend
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:vehicle_rental}
    username: ${DB_USER:vrs}
    password: ${DB_PASSWORD:vrs_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # Schema do Flyway quản lý (V1, V2...), Hibernate không tự đổi CSDL
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:doi-chuoi-nay-thanh-chuoi-ngau-nhien-dai-it-nhat-32-ky-tu}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
